<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Open Browser Use · Electron IAB</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<aside class="sidebar">
  <div class="brand"><h1>Electron IAB</h1></div>
  <button id="play" class="play" data-mode="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-mark" d="m9 5 10 7-10 7Z"/><rect class="stop-mark" x="6" y="6" width="12" height="12" rx="1"/></svg><span id="play-label">一键播放</span></button>
  <label class="feedback-toggle"><input id="feedback-enabled" type="checkbox" checked>操作提示</label>
  <section class="steps-section"><div class="section-heading"><h2>动作</h2><span id="step-progress">0 / 5</span></div><div class="methods">
    <button class="method step" data-step="1"><span class="step-number">1</span><span>打开 Tab 1</span><span class="step-state"></span></button>
    <button class="method step" data-step="2"><span class="step-number">2</span><span>打开 Tab 2</span><span class="step-state"></span></button>
    <button class="method step" data-step="3"><span class="step-number">3</span><span>Tab 1 · 点击</span><span class="step-state"></span></button>
    <button class="method step" data-step="4"><span class="step-number">4</span><span>Tab 2 · 输入提交</span><span class="step-state"></span></button>
    <button class="method step" data-step="5"><span class="step-number">5</span><span>Tab 3 · GitHub</span><span class="step-state"></span></button>
  </div></section>
  <section class="result" hidden><div class="result-inner"><h2>运行状态</h2><p id="result" hidden></p><div id="error" role="alert" hidden></div><details id="result-details" hidden><summary>查看结果</summary><pre id="log"></pre></details></div></section>
</aside>
<section class="browser-panel" aria-label="浏览器侧边面板">
  <div class="tab-bar"><div id="tabs" class="tabs" role="tablist" aria-label="浏览器标签"></div><button class="icon" data-action="create" title="新建标签" aria-label="新建标签"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="toolbar">
    <button class="icon" data-action="back" id="back" title="后退" aria-label="后退"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg></button><button class="icon" data-action="forward" id="forward" title="前进" aria-label="前进"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 7 7-7 7M21 12H3"/></svg></button><button class="icon" data-action="reload" id="reload" title="重新加载" aria-label="重新加载"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 7l-2-2"/></svg></button>
    <form id="address-form" class="address-form"><span class="address-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18"/></svg></span><input id="address" aria-label="网页地址" placeholder="输入网址，按 Enter 访问" autocomplete="off" spellcheck="false"></form>
    <button class="icon" data-action="hide" title="隐藏网页，保留所有标签" aria-label="隐藏网页"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </div>
  <div class="panel-info"><span>work</span><span id="status" role="status">准备中</span></div>
  <div id="viewport" class="viewport"><div id="empty" class="empty"><h2 id="empty-heading">开始演示</h2><p id="empty-description" hidden>点击左侧步骤，或一键播放。</p><button id="empty-play">播放演示</button></div></div>
</section>
</main>
<script type="module" src="renderer.js"></script>
</body>
</html>
